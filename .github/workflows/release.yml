name: Release
# release.yml version: 0.3.0

on:
  push:
    tags:
      - 'v*' # Trigger workflow on tags starting with 'v'
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build project
        run: uv build

      - name: Publish to PyPI
        run: uv publish

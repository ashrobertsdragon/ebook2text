[project]
name = "ebook2text"
description = "Convert common book file types to text for machine learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashlynn Antrobus", email = "ashlynn@prosepal.io" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing"
]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "ebooklib>=0.20",
  "openai>=1.54.3",
  "pdfminer-six>=20240706",
  "pillow>=12.3.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/ashrobertsdragon/ebook2text"

[project.optional-dependencies]
all = ["ebook2text[gemini,anthropic]"]
anthropic = ["anthropic>=0.40.0"]
gemini = ["google-genai>=1.0.0"]

[dependency-groups]
dev = [
  "anthropic>=0.40.0",
  "google-genai>=1.0.0",
  "pytest>=8.3.3",
  "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/ebook2text"
exclude_gitignore = true
ignore_missing_imports = true
follow_imports = "silent"
follow_untyped_imports = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "dist",
  "build",
  ".vscode",
  ".egg-info"
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/{tests,docs,tools}/*" = ["F401", "I001", "E501", "N806"]
"**/VERSION.py" = ["N999"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"
